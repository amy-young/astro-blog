name: Build and Deploy (Staging)

on:
  push:
    branches:
      - staging
  # Manual trigger. Added 2026-08-06 after a push to staging landed on the remote but
  # GitHub never created a run, leaving no way to deploy short of an empty commit and
  # nothing to `gh run rerun` against. Lets a stuck deploy be kicked off by hand:
  #   gh workflow run "Build and Deploy (Staging)" -R amy-young/astro-blog --ref staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm astro check && pnpm astro build --site https://staging.amyyoung.me

      - name: Deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: dist/*
          target: /var/www/staging.amyyoung.me
          strip_components: 1
          rm: true
